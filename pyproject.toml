[project]
name = "mlops-basics"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "dvc>=3.67.1",
    "hypothesis>=6.170.15",
    "mlflow>=3.18.0",
    "pandas>=3.1.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "torch>=2.15.0",
    "ty>=0.0.88",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: проверка полного пайплайна",
]
